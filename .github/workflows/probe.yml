name: Sondagem da Twitch

# Diagnóstico manual: confirma que os servidores do GitHub conseguem listar e
# descarregar clips da Twitch. Não precisa de segredos.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal da Twitch a testar"
        type: string
        default: "shroud"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar yt-dlp e ffmpeg
        run: |
          pip install -q yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Listar os clips da semana
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          yt-dlp --flat-playlist --playlist-end 3 --print "%(url)s" \
            "https://www.twitch.tv/${CHANNEL}/clips?range=7d" | tee clips.txt
          test -s clips.txt

      # Que dados dá a listagem sem chaves da Twitch? Serve para saber se o
      # sistema consegue escolher clips (jogo, visualizações, data) sem a API.
      - name: Mostrar os dados disponíveis sem chaves
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          yt-dlp --flat-playlist --playlist-end 2 -J \
            "https://www.twitch.tv/${CHANNEL}/clips?range=24hr" > flat.json || true
          yt-dlp --skip-download -J "$(head -1 clips.txt)" > full.json || true
          python - <<'EOF'
          import json
          keep = ("id", "title", "duration", "view_count", "timestamp", "upload_date",
                  "channel", "uploader", "uploader_id", "creator", "categories", "game",
                  "language", "url", "webpage_url")
          for name in ("flat.json", "full.json"):
              try:
                  data = json.load(open(name))
              except Exception as error:
                  print(name, "ILEGIVEL", error)
                  continue
              entries = data.get("entries") or [data]
              print("==", name, "entradas:", len(entries))
              for entry in entries[:2]:
                  print("  campos:", sorted(k for k, v in entry.items() if v not in (None, [], "")))
                  print("  amostra:", {k: entry.get(k) for k in keep if entry.get(k) not in (None, [], "")})
          EOF

      - name: Descarregar o primeiro clip
        run: yt-dlp -f "best[ext=mp4]/best" -o "clip.%(ext)s" "$(head -1 clips.txt)"

      - name: Mostrar o formato do vídeo
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height \
            -of default=noprint_wrappers=1 clip.*
