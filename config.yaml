# Jogo a seguir, com o nome exato da categoria na Twitch.
game_name: "Grand Theft Auto VI"

# Canais da Twitch dos streamers que te autorizaram.
# A facecam é detetada sozinha. Se o resultado sair mal para um streamer,
# indica a zona à mão (em píxeis da imagem original da stream):
#
# streamers:
#   - twitch: nome_do_canal
#   - twitch: outro_canal
#     facecam: {x: 0, y: 720, w: 480, h: 360}
streamers:
  - twitch: caedrel
  - twitch: kaicenat
  - twitch: hasanabi
  - twitch: theburntpeanut
  - twitch: jynxzi
  - twitch: zackrawrr
  - twitch: xqc
  - twitch: caseoh_
  - twitch: ibai
  - twitch: rubius

selection:
  lookback_hours: 6     # só clips criados nas últimas N horas
  min_views: 30         # visualizações mínimas na Twitch
  min_duration: 15      # segundos
  max_duration: 60      # segundos
  max_per_run: 2        # clips entregues por execução
  max_per_day: 5        # clips entregues por dia (UTC)

# Gancho: o vídeo abre com o momento mais forte do clip (pico de volume) e
# com uma frase curta em cima. A frase é escrita pelo Gemini (segredo
# GEMINI_API_KEY, gratuito), senão pelo Pollinations, senão vem de uma lista.
hook:
  enabled: true
  seconds: 1.5                  # duração do flash-forward (0 = sem flash-forward)
  model: gemini-flash-latest    # modelo gratuito do Gemini

metadata:
  # A primeira hashtag vai também no título.
  hashtags: ["#GTA6", "#GTAVI", "#shorts"]
