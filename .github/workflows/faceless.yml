name: Factos (MoneyPrinterTurbo)

# Dois vídeos por dia de factos sobre Miami e a Flórida, entregues no Telegram.
# A IA é o GitHub Models (grátis, com o token do próprio workflow).
# Precisa dos Secrets PIXABAY_API_KEY (ou PEXELS_API_KEY), TELEGRAM_BOT_TOKEN e
# TELEGRAM_CHAT_ID. Sem eles, falha e o GitHub avisa por email.
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: faceless
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPT_HOME: ${{ github.workspace }}/../mpt-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg e o MoneyPrinterTurbo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q mpt requests pyyaml

      - name: Escolher o tema
        env:
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python faceless/plan.py faceless_out

      - name: Fazer o vídeo
        run: |
          field() { python -c 'import json,sys;print(json.load(open("faceless_out/plan.json",encoding="utf-8"))[sys.argv[1]])' "$1"; }
          # O guião e as palavras de pesquisa vêm do plan.json: o MoneyPrinterTurbo
          # não precisa de IA nenhuma para fazer o vídeo.
          mpt cli \
            --video-subject "$(field subject)" \
            --video-script "$(field script)" \
            --video-terms "$(field terms)" \
            --video-source "$(field source)" \
            --video-language en-US \
            --video-aspect 9:16 \
            --video-count 1 \
            --voice-name en-US-ChristopherNeural-Male \
            --bgm-type none \
            --subtitle-display-mode word_by_word \
            --subtitle-animation pop_spring \
            --subtitle-position bottom

      - name: Entregar no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python faceless/finish.py faceless_out

      - name: Guardar os temas feitos
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add faceless/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "faceless: tema feito [skip ci]"
          git pull -q --rebase
          git push -q
