name: Clipper

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ensaio: não envia para o Telegram; guarda os vídeos como artefacto"
        type: boolean
        default: false
      game_name:
        description: "Outro jogo só nesta execução (vazio = o do config.yaml)"
        type: string
        default: ""

concurrency:
  group: clipper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar ffmpeg e tipo de letra de emoji
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji

      - name: Cache do modelo de legendas
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Instalar o clipper
        run: pip install -e . -c constraints.txt

      - name: Procurar, editar e entregar clips
        env:
          # As quatro chaves são opcionais. Sem as da Twitch, os clips vêm das
          # páginas públicas; sem as do Telegram, os vídeos são publicados na
          # página Releases deste repositório, com o acesso da própria execução.
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GAME_NAME: ${{ inputs.game_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m clipper run --game-name "$GAME_NAME" --dry-run
          else
            python -m clipper run --game-name "$GAME_NAME"
          fi

      - name: Publicar os vídeos do ensaio
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: clips-de-ensaio
          path: out/
          if-no-files-found: warn
          retention-days: 3

      # Fotogramas dos vídeos do ensaio, num ramo à parte ("ensaio"), para se
      # poder ver o aspeto dos clips sem descarregar os vídeos inteiros.
      - name: Guardar fotogramas do ensaio
        if: ${{ inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previews
          for video in out/*.mp4; do
            [ -e "$video" ] || continue
            name=$(basename "$video" .mp4)
            ffmpeg -v error -y -ss 1 -i "$video" -frames:v 1 -vf scale=405:720 "previews/${name}_1s.jpg"
            ffmpeg -v error -y -ss 12 -i "$video" -frames:v 1 -vf scale=405:720 "previews/${name}_12s.jpg"
            cp "out/${name}.txt" previews/ 2>/dev/null || true
          done
          if [ -z "$(ls previews)" ]; then exit 0; fi
          cd previews
          git init -q -b ensaio
          git add -A
          git -c user.name=clipper-bot -c user.email=clipper-bot@users.noreply.github.com \
            commit -q -m "fotogramas do ensaio"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ensaio

      # Corre mesmo que o passo anterior falhe ou seja interrompido: o que já
      # foi entregue fica registado e não volta a ser enviado.
      - name: Guardar o estado
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if [ ! -f state/state.json ]; then exit 0; fi
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "state: atualizar clips tratados [skip ci]"
          git pull -q --rebase
          git push -q
