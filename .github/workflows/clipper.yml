name: Clipper

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ensaio: não envia para o Telegram; guarda os vídeos como artefacto"
        type: boolean
        default: false
      game_name:
        description: "Outro jogo só nesta execução (vazio = o do config.yaml)"
        type: string
        default: ""

concurrency:
  group: clipper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Enquanto as chaves não estiverem guardadas nos Secrets, as execuções
  # agendadas terminam aqui em segundos e sem erro, em vez de falharem (e
  # enviarem um email) de 15 em 15 minutos. Uma execução lançada à mão falha,
  # para quem a lançou ver logo o que falta.
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Verificar se as chaves estão configuradas
        id: check
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          missing=""
          [ -n "$TWITCH_CLIENT_ID" ] || missing="$missing TWITCH_CLIENT_ID"
          [ -n "$TWITCH_CLIENT_SECRET" ] || missing="$missing TWITCH_CLIENT_SECRET"
          if [ "$DRY_RUN" != "true" ]; then
            [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN"
            [ -n "$TELEGRAM_CHAT_ID" ] || missing="$missing TELEGRAM_CHAT_ID"
          fi
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Chaves por configurar:$missing. Vê o passo 4 do README."
          if [ "$EVENT" = "workflow_dispatch" ]; then
            exit 1
          fi

  run:
    needs: keys
    if: ${{ needs.keys.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar ffmpeg e tipo de letra de emoji
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji

      - name: Cache do modelo de legendas
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Instalar o clipper
        run: pip install -e . -c constraints.txt

      - name: Procurar, editar e entregar clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GAME_NAME: ${{ inputs.game_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m clipper run --game-name "$GAME_NAME" --dry-run
          else
            python -m clipper run --game-name "$GAME_NAME"
          fi

      - name: Publicar os vídeos do ensaio
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: clips-de-ensaio
          path: out/
          if-no-files-found: warn
          retention-days: 3

      # Corre mesmo que o passo anterior falhe ou seja interrompido: o que já
      # foi entregue fica registado e não volta a ser enviado.
      - name: Guardar o estado
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if [ ! -f state/state.json ]; then exit 0; fi
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "state: atualizar clips tratados [skip ci]"
          git pull -q --rebase
          git push -q
